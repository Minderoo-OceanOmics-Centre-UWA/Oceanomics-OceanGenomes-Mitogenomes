name: webin_validate_genome
description: Validate a finished ENA genome-context package against test or production Webin.
keywords: [ena, webin, genome, validation]
tools:
  - webin-cli:
      description: ENA Webin command-line submission interface
input:
  - package:
      type: directory
      description: Self-contained ENA candidate package.
  - service:
      type: string
      description: test or production.
output:
  - status:
      type: file
      pattern: "*.webin_*_status.tsv"
  - reports:
      type: directory
      pattern: "webin_*_output"
